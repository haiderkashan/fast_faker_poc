[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "async-batch-faker"
version = "0.1.3.1"
description = "A ridiculously fast, asynchronous, and vectorized mock data generator for Python."
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.20.0",
    "faker>=10.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
async_batch_faker = ["locales/*.json"]