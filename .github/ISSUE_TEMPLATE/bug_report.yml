name: 🐛 Bug Report
description: Create a report to help us improve async-batch-faker
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report! 
        Before submitting, please ensure you are running the latest version of `async-batch-faker`.
  - type: input
    id: version
    attributes:
      label: async-batch-faker Version
      description: What version of the library are you using? (e.g., 0.1.3)
      placeholder: "0.1.3"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS and Python version (e.g., Ubuntu 22.04, Python 3.11)
      placeholder: "Windows 11, Python 3.11.9"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description of the Bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproducible Code Snippet
      description: Please provide a minimal code snippet that reproduces the error.
      value: |
        ```python
        from async_batch_faker import AsyncBatchFaker

        # Your code here
        ```
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
